name: PhotoEditorIOS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  PhotoEditorIOS:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photoeditorios
        PRODUCT_NAME: PhotoEditor
        INFOPLIST_KEY_CFBundleDisplayName: "Photo Editor"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Para tomar fotos y editarlas."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para elegir las fotos, videos y GIFs que quieres editar."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Para guardar tus imágenes y GIFs editados en Fotos."
