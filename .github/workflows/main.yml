name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto de Xcode
        run: xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild \
            -project PhotoEditorIOS.xcodeproj \
            -scheme PhotoEditorIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoEditor.app Payload/
          zip -r PhotoEditor.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-ipa
          path: PhotoEditor.ipa
